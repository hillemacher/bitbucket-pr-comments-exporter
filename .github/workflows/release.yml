name: Release MCP

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hillemacher/bitbucket-pr-mcp

jobs:
  security:
    uses: ./.github/workflows/security.yml

  validate:
    needs: security
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ['RELEASE_TAG']
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}':
              raise SystemExit('Stable vX.Y.Z tag must match pyproject.toml version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - run: python -m pip install '.[mcp]'
      - run: python -m unittest discover

  build:
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[mcp]'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native candidate
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker build --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            -f container/Dockerfile -t "$IMAGE:sha-$GITHUB_SHA-$ARCH" .
      - name: Scan image before upload
        env:
          ARCH: ${{ matrix.arch }}
        run: python tools/security_check.py image "$IMAGE:sha-$GITHUB_SHA-$ARCH" --output dist/image-security
      - name: Retain image scan and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ matrix.arch }}
          path: |
            dist/image-security/vulnerabilities.json
            dist/image-security/sbom.cdx.json
          if-no-files-found: warn
      - name: Smoke test before upload
        env:
          ARCH: ${{ matrix.arch }}
        run: python tests/smoke_container.py "$IMAGE:sha-$GITHUB_SHA-$ARCH"
      - name: Upload tested architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish combined manifest and bundle
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tags=(-t "$IMAGE:$VERSION")
          highest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then
            tags+=(-t "$IMAGE:latest")
            echo "PUBLISH_LATEST=1" >> "$GITHUB_ENV"
          else
            echo "::notice::Not moving latest: $GITHUB_REF_NAME is not the highest stable tag ($highest)"
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          python tools/build_mcp_bundle.py --image "$IMAGE@$digest"
          printf 'Image: `%s@%s`\n' "$IMAGE" "$digest" > dist/release-notes.md
      - name: Verify public downloads without credentials
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull --platform linux/amd64 "$IMAGE:${{ needs.validate.outputs.version }}"
          docker --config "$anonymous_config" pull --platform linux/arm64 "$IMAGE:${{ needs.validate.outputs.version }}"
          if [ "${PUBLISH_LATEST:-}" = "1" ]; then
            repo=${IMAGE#ghcr.io/}
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')
            manifest_digest() {
              curl -fsSI -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/$repo/manifests/$1" \
                | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}'
            }
            versioned=$(manifest_digest "${{ needs.validate.outputs.version }}")
            latest=$(manifest_digest latest)
            [ -n "$versioned" ] && [ "$versioned" = "$latest" ] \
              || { echo "latest ('$latest') does not match version ('$versioned')" >&2; exit 1; }
          fi
      - name: Scan final release bundle
        run: python tools/security_check.py secrets --artifacts dist --output "$RUNNER_TEMP/publish-security"
      - name: Retain final bundle scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle-security
          path: ${{ runner.temp }}/publish-security/*.json
          if-no-files-found: warn
      - name: Attach bundle to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/bitbucket-pr-mcp.zip --clobber
