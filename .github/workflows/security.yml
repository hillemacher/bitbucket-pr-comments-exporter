name: Security checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build review artifacts
        run: |
          python -m pip install --upgrade pip==26.3 build
          python -m build --outdir dist/security-artifacts
          python tools/build_skill.py --output dist/security-artifacts/bitbucket-pr-feedback.zip
          python tools/build_mcp_bundle.py --preview --output dist/security-artifacts/bitbucket-pr-mcp-preview.zip
      - name: Scan all reachable commits and packaged files
        run: python tools/security_check.py secrets --artifacts dist/security-artifacts --output dist/security-reports
      - name: Retain redacted reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-security
          path: dist/security-reports/*.json
          if-no-files-found: warn
