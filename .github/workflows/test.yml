name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} / MCP ${{ matrix.mcp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        mcp: [false, true]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional MCP dependencies
        if: matrix.mcp
        run: python -m pip install ".[mcp]"

      - name: Run tests
        run: python -m unittest discover
