name: Candidate MCP

on:
  push:
    tags: ['mcp-candidate-*']

permissions:
  contents: read

concurrency:
  group: mcp-candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hillemacher/bitbucket-pr-mcp

jobs:
  security:
    uses: ./.github/workflows/security.yml

  validate:
    needs: security
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: version
        env:
          CANDIDATE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os, re, tomllib
          tag = os.environ['CANDIDATE_TAG']
          revision = os.environ['GITHUB_SHA']
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if not re.fullmatch(r'mcp-candidate-[A-Za-z0-9][A-Za-z0-9._-]*', tag):
              raise SystemExit('Expected an explicit mcp-candidate-* tag')
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Expected a full source commit SHA')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Expected a stable package version for candidate testing')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PYTHON
      - run: python -m pip install '.[mcp]'
      - run: python -m unittest discover

  build:
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[mcp]'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native candidate
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker build --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            -f container/Dockerfile -t "$IMAGE:candidate-$GITHUB_SHA-$ARCH" .
      - name: Scan image before upload
        env:
          ARCH: ${{ matrix.arch }}
        run: python tools/security_check.py image "$IMAGE:candidate-$GITHUB_SHA-$ARCH" --output dist/image-security
      - name: Retain image scan and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ matrix.arch }}
          path: |
            dist/image-security/vulnerabilities.json
            dist/image-security/sbom.cdx.json
          if-no-files-found: warn
      - name: Smoke test before upload
        env:
          ARCH: ${{ matrix.arch }}
        run: python tests/smoke_container.py "$IMAGE:candidate-$GITHUB_SHA-$ARCH"
      - name: Upload tested architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: docker push "$IMAGE:candidate-$GITHUB_SHA-$ARCH"

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested candidate manifest
        id: manifest
        run: |
          docker buildx imagetools create -t "$IMAGE:candidate-$GITHUB_SHA" \
            "$IMAGE:candidate-$GITHUB_SHA-amd64" "$IMAGE:candidate-$GITHUB_SHA-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:candidate-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          echo "image_ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - name: Verify public downloads without credentials
        env:
          IMAGE_REF: ${{ steps.manifest.outputs.image_ref }}
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull --platform linux/amd64 "$IMAGE_REF"
          # Classic Docker stores one platform per digest reference. Remove only
          # this job's first pull before verifying the other platform.
          docker --config "$anonymous_config" image rm "$IMAGE_REF"
          docker --config "$anonymous_config" pull --platform linux/arm64 "$IMAGE_REF"
      - name: Build candidate bundle and record provenance
        env:
          IMAGE_REF: ${{ steps.manifest.outputs.image_ref }}
          VERSION: ${{ needs.validate.outputs.version }}
          CANDIDATE_TAG: ${{ github.ref_name }}
        run: |
          python tools/build_mcp_bundle.py --image "$IMAGE_REF" --output dist/bitbucket-pr-mcp-candidate.zip
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          metadata = {
              'candidate_tag': os.environ['CANDIDATE_TAG'],
              'source_commit': os.environ['GITHUB_SHA'],
              'package_version': os.environ['VERSION'],
              'image_tag': os.environ['IMAGE'] + ':candidate-' + os.environ['GITHUB_SHA'],
              'image_ref': os.environ['IMAGE_REF'],
              'platforms': ['linux/amd64', 'linux/arm64'],
          }
          Path('dist/candidate.json').write_text(json.dumps(metadata, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# MCP candidate\n\n```json\n' + json.dumps(metadata, indent=2) + '\n```\n')
          PYTHON
      - name: Scan final candidate bundle
        run: python tools/security_check.py secrets --artifacts dist --output "$RUNNER_TEMP/publish-security"
      - name: Retain final bundle scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-bundle-security
          path: ${{ runner.temp }}/publish-security/*.json
          if-no-files-found: warn
      - name: Upload candidate ZIP and metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bitbucket-pr-mcp-candidate-${{ github.sha }}
          path: |
            dist/bitbucket-pr-mcp-candidate.zip
            dist/candidate.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
