# Example configuration for Bitbucket PR Comments Exporter.
# MCP requires a full PR URL; repository defaults below apply only to the CLI.
# Copy this file to either:
#   ./bb-export.toml
#   ~/.config/bb-export/config.toml
# or pass it explicitly with:
#   bb-export server --config bb-export.toml --pr 500
#
# Do not put API tokens or personal access tokens in this file.
# Use --token or the BB_TOKEN environment variable for secrets.

[server]
# Base URL for Bitbucket Server/Data Center. If Bitbucket is hosted under a
# context path, include it here, for example "https://company.example/bitbucket".
# HTTPS is required when sending credentials. Use the final API host: redirects to another origin are rejected.
server = "https://bitbucket.CompanyX"

# Static repository location. These can still be overridden by CLI flags or
# values parsed from --url.
project = "CoolP"
repo = "SomeRepo"

# Optional. If omitted, use --username or BB_USERNAME when your auth mode needs
# a username. Bearer/PAT-style auth may not need one.
username = "your.username"

[cloud]
# Use this section instead of [server] for Bitbucket Cloud defaults.
# Supply a scoped API token with read:pullrequest:bitbucket using --token or BB_TOKEN.
# workspace = "your-workspace"
# repo = "your-repo"
# MCP can infer the Cloud instance from this section, but requires a full PR URL.

[defaults]
# Directory for generated files when --output is not provided. The exporter will
# write names like pr_500_comments.md or pr_500_comments.json inside it.
output_dir = "exports"

# Output format: "md" for LLM-friendly Markdown, or "json" for normalized data.
format = "md"

# Socket operations have a maximum 30-second timeout within the export budget.

# Omit deleted comments in both formats by default. If true, Markdown shows
# ~~[deleted]~~ and JSON retains deleted records and any provider-supplied body.
include_deleted = false

# Optional container MCP settings. The container's setup writes its own config
# under ~/.config/bitbucket-pr-mcp/config.toml; its separate bitbucket.pat file
# is loaded into BB_TOKEN by the entrypoint. Never put a token in this TOML.
[mcp]
# Optional explicit instance boundary; include the Server context path.
# Without this setting, MCP uses [server].server or Cloud repository defaults.
# When both providers are populated, this setting selects the instance.
# Cloud: "https://bitbucket.org"
base_url = "https://bitbucket.CompanyX"

# Shared CLI/MCP export limits. All values must be positive and finite.
# DNS resolution may overrun socket deadlines on some platforms.
[limits]
timeout_seconds = 90
max_pages = 1000
max_response_bytes = 8388608 # 8 MiB, including error responses
max_total_bytes = 67108864 # 64 MiB across the entire export
