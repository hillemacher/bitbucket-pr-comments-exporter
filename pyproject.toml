[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitbucket-pr-comments-exporter"
version = "0.1.2"
description = "Export Bitbucket pull request comments to LLM-friendly Markdown."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Bitbucket PR Comments Exporter contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3", "tomlkit>=0.13,<1"]

[project.urls]
Homepage = "https://github.com/hillemacher/bitbucket-pr-comments-exporter"
Repository = "https://github.com/hillemacher/bitbucket-pr-comments-exporter"
Issues = "https://github.com/hillemacher/bitbucket-pr-comments-exporter/issues"

[project.scripts]
bb-export = "bb_pr_export.cli:main"
bb-export-mcp = "bb_pr_export.mcp_server:main"

[tool.setuptools.packages.find]
include = ["bb_pr_export*"]
